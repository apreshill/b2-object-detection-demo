[project]
name = "b2-object-detection-demo"
version = "0.1.0"
description = "Build an object-detection training set from videos with Pixeltable and Backblaze B2."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "boto3>=1.36",
    "ipykernel>=6.27",
    "jupyterlab>=4.0",
    "pixeltable",
    "pixeltable-yolox==0.4.2",
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.uv.sources]
pixeltable = { git = "https://github.com/pixeltable/pixeltable.git" }
